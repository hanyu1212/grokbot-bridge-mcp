[mcp_servers.grokbot]
command = "npx"
args = ["-y", "grokbot-bridge-mcp"]
env = { GROKBOT_AGENTS = "Grok Bot" }
startup_timeout_sec = 90
# Must exceed the 600-second wait_seconds cap.
tool_timeout_sec = 660
# Uncomment to skip the confirmation before grokbot_ask / grokbot_interrupt.
# default_tools_approval_mode = "approve"
